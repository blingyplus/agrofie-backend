version: v1.3.1

dsn: postgres://agrofie:agrofie@postgres:5432/agrofie?sslmode=disable&search_path=kratos

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:8080
        - http://localhost:19006
        - http://127.0.0.1:8080
        - http://127.0.0.1:19006
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:8080/
  allowed_return_urls:
    - http://localhost:8080
    - http://localhost:19006
  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
  flows:
    error:
      ui_url: http://localhost:8080/error
    settings:
      ui_url: http://localhost:8080/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: http://localhost:8080/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://localhost:8080/verification
      use: code
      after:
        default_browser_return_url: http://localhost:8080/
    logout:
      after:
        default_browser_return_url: http://localhost:8080/
    login:
      ui_url: http://localhost:8080/login
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: http://localhost:8080/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: info
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32BYTESLONGSECRETNOTSECURE000000

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailhog:1025/?disable_starttls=true
    from_address: noreply@agrofie.local
    from_name: Agrofie
