# gqlgen configuration — run: make gqlgen
# Scaffold uses a hand-rolled GraphQL dispatcher in internal/gateway that mirrors
# graph/schema.graphqls. Replace with generated resolvers when domain mutations grow.

schema:
  - graph/*.graphqls
exec:
  filename: graph/generated.go
  package: graph
model:
  filename: graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graph
  package: graph
