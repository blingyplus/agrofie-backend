name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vuln check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
