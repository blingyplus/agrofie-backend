version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations/000001_lookups.up.sql"
      - "db/migrations/000002_identity.up.sql"
      - "db/migrations/000003_talent.up.sql"
      - "db/migrations/000004_bookings.up.sql"
      - "db/migrations/000006_identity_kratos.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
